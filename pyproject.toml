[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "omnigent-muse"
version = "0.1.0"
description = "Muse Code (MSP) community harness for Omnigent"
readme = "README.md"
requires-python = ">=3.12"          # match omnigent (the Muse SDK itself is 3.10+)
license = "MIT"
dependencies = [
  "omnigent>=0.11.0.dev0,<1",       # pin to the core version you build against
]

[dependency-groups]
dev = [
  "pytest>=7",
  "pytest-asyncio>=0.23",
  "ruff>=0.11",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[project.entry-points."omnigent.community.harness"]
muse = "omnigent.community.harness.muse.plugin:get_contribution"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

# Local sibling checkout for offline/dev installs. Remove before publishing.
[tool.uv.sources]
omnigent      = { path = "../omnigent", editable = true }
