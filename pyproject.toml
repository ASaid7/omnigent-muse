[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "omnigent-muse"
version = "0.1.0"
description = "Muse Code (MSP) community harness for Omnigent"
readme = "README.md"
requires-python = ">=3.12"          # match omnigent (the Muse SDK itself is 3.10+)
license = "MIT"
dependencies = [
  "omnigent>=0.11.0.dev0,<1",       # pin to the core version you build against
  "muse-code-sdk>=1.3,<2",          # import `muse_code`  (used in Step 2)
  "muse-code-msp>=1.3,<2",          # import `muse_code_msp`
]

[dependency-groups]
dev = [
  "pyrefly==1.1.1",
  "pytest>=7",
  "ruff>=0.11",
]

[project.entry-points."omnigent.community.harness"]
muse = "omnigent.community.harness.muse.plugin:get_contribution"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

# Local sibling checkouts for offline/dev installs. Remove before publishing.
[tool.uv.sources]
omnigent      = { path = "../omnigent", editable = true }
muse-code-sdk = { path = "../muse-code-sdk/python/clients/sdk-py", editable = true }
muse-code-msp = { path = "../muse-code-sdk/python/clients/msp-py", editable = true }
